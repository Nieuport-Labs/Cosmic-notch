<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#16181d"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe9f2"/>
      <stop offset="1" stop-color="#3fb6cf"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="58" rx="28" fill="url(#gloss)"/>
  <rect x="6.5" y="6.5" width="115" height="115" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <!-- the expanded island, glass -->
  <rect x="20" y="52" width="88" height="56" rx="16" fill="url(#card)"/>
  <rect x="28" y="64" width="26" height="26" rx="8" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="62" y="68" width="34" height="6" rx="3" fill="#ffffff" fill-opacity="0.75"/>
  <rect x="62" y="80" width="22" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.4"/>
  <!-- the compact island -->
  <g filter="url(#shadow)">
    <rect x="22" y="22" width="84" height="32" rx="16" fill="#08090b"/>
  </g>
  <rect x="22.5" y="22.5" width="83" height="31" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
  <rect x="30" y="29" width="18" height="18" rx="6" fill="url(#accent)"/>
  <rect x="62" y="31" width="5" height="14" rx="2.5" fill="url(#accent)"/>
  <rect x="71" y="35" width="5" height="10" rx="2.5" fill="url(#accent)"/>
  <rect x="80" y="28" width="5" height="17" rx="2.5" fill="url(#accent)"/>
  <rect x="89" y="33" width="5" height="12" rx="2.5" fill="url(#accent)"/>
</svg>
